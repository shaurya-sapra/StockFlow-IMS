<!-- Uses base.html as a parent template for code reusability -->
{% extends "base_screen.html" %}

{% block title %}Product Management{% endblock %}

{% block head %}
  <!-- Head block includes external stylesheets and scripts needed -->
  <link rel="stylesheet" href="static/css/product_management.css">

  <script src="static/js/product_management.js"></script>
{% endblock %}

{% block content %}
  <div class="header">
    <h1 class="page-title">Product Management</h1>
    <button id="add-product-btn" class="add-product-btn">Add Product</button>
    <button id="delete-product-btn" class="delete-product">Delete Product</button>
  </div>

  <!-- Add Product Form -->
  <div id="add-product-form" class="user-form">
    <h2>Add New Product</h2>
    <form id="product-form">
      <!-- Category Selection -->
      <label for="category-select">Category:</label>
      <select id="category-select" name="category" required>
        <option value="Fruit & Veg">Fruit & Veg</option>
        <option value="Dairy">Dairy</option>
        <option value="Meat">Meat</option>
        <option value="Snacks">Snacks</option>
        <option value="Bread & Bakery">Bread & Bakery</option>
      </select>

      <!-- Product Name -->
      <label for="product-name">Product Name:</label>
      <input type="text" id="product-name" name="product_name" required>

      <!-- Price -->
      <label for="price">Price (£):</label>
      <input type="number" id="price" name="price" step="0.01" required>

      <!-- Weight -->
      <label for="weight">Weight (g):</label>
      <input type="number" id="weight" name="weight" step="0.1" required>

      <!-- Calories -->
      <label for="calories">Calories:</label>
      <input type="number" id="calories" name="calories" required>

      <!-- Carbs -->
      <label for="carbs">Carbs (g):</label>
      <input type="number" id="carbs" name="carbs" step="0.1" required>

      <!-- Protein -->
      <label for="protein">Protein (g):</label>
      <input type="number" id="protein" name="protein" step="0.1" required>

      <!-- Fat -->
      <label for="fat">Fat (g):</label>
      <input type="number" id="fat" name="fat" step="0.1" required>

      <!-- Expiry Date -->
      <label for="expiry-date">Expiry Date:</label>
      <input type="date" id="expiry-date" name="expiry_date" required>

      <!-- Supplier -->
      <label for="supplier">Supplier:</label>
      <input type="text" id="supplier" name="supplier" required>

      <!-- Stock -->
      <label for="stock">Stock:</label>
      <input type="number" id="stock" name="stock" min="0" required>

      <!-- Date Added -->
      <label for="date-added">Date Added:</label>
      <input type="date" id="date-added" name="date_added" required>

      <!-- Submit Button -->
      <button type="submit" class="add-product-btn">Add Product</button>
    </form>
  </div>

  <!-- Delete Product Form -->
  <div id="delete-product-form" class="user-form">
    <h2>Delete Product</h2>
    <form id="delete-form">
      <!-- Product Selection Dropdown -->
      <label for="product-select">Product:</label>
      <select id="product-select" name="product" required>
      </select>

      <!-- Submit Button -->
      <button type="submit" class="delete-product">Delete Product</button>
    </form>
  </div>
{% endblock %}
